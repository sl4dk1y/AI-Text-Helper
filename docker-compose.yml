services:
  langfuse:
    image: langfuse/langfuse:2.45.0
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
      - NEXTAUTH_SECRET=langfuse-secret-key-change-me
      - SALT=langfuse-salt-change-me
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Доступ к хосту с Mac/Linux
    environment:
      - LANGFUSE_PUBLIC_KEY=${ENV_VAR}
      - LANGFUSE_SECRET_KEY=${ENV_VAR}
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      - langfuse
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitexthelper-fastapi
    ports:
      - "8000:8000"
    env_file: .env          
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - TEMPERATURE=${TEMPERATURE}
      - MAX_TOKENS=${MAX_TOKENS}
    depends_on:
      - litellm
    networks:
      - aitexthelper_network
    restart: unless-stopped

  locust:
    image: locustio/locust:latest
    container_name: aitexthelper-locust
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://host.docker.internal:8000
    profiles:
      - test
    restart: unless-stopped

networks:
  aitexthelper_network:
    driver: bridge  

volumes:
  langfuse_postgres_data: